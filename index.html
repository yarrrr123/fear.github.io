<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lust | links</title>
    <style>
        /* 1. Основные настройки фона */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            background: url('https://i.pinimg.com/736x/f4/26/40/f42640c2ca66b60ed7c822aee11fb458.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        } 

        /* Затемнение фона */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* 2. Стили карточки */
        .card {
            position: relative;
            width: 350px;
            padding: 40px 25px;
            background: rgba(255, 255, 255, 0.1); /* Прозрачность */
            backdrop-filter: blur(15px); /* Размытие фона под карточкой */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        /* Аватарка */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .location {
            font-size: 14px;
            
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        /* 3. Стили кнопок */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1); /* Полупрозрачная кнопка */
            padding: 14px;
            border-radius: 18px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Эффект при наведении на кнопку */
        .link-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px); /* Легкое всплытие кнопки */
        }

        /* Подвал */
        .footer {
            margin-top: 35px;
            font-size: 12px;
            opacity: 0.4;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://i.pinimg.com/736x/e2/8f/4c/e28f4ccdbeee7bc87d8cb1e5ec525eda.jpg" alt="Avatar" class="avatar">
        
        <h1>lust</h1>
        <div class="subtitle">prefer lust than gluttony</div>
        <div class="location">📍 Russia</div>

        <div class="links-container">
            
            <a href="https://osu.ppy.sh/users/36566246" class="link-btn">Osu</a>
            <a href="https://steamcommunity.com/id/ikisty/" class="link-btn">Steam</a>
            <a href="https://soundcloud.com/ikisty" class="link-btn">Soundcloud</a>
            <a href="https://t.me/preferlust" class="link-btn">Main account</a>
            <a href="https://t.me/lustproject" class="link-btn">Work account</a>

        </div>

        <div class="footer">
            © Discord: larpingstudios
        </div>
    </div>

</body>
</html>
